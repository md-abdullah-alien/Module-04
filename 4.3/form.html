<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitha Ghor</title>
    <style>
        form .basic-info label {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <header></header>
    <main>
        <section>
            <h2>Jamal Mother Pitha Ghor</h2>
            <form>
                <fieldset class="basic-info">
                    <legend>Basic Info</legend>
                    <label for="name">Your Name: </label>
                    <input type="text" name="" id="name">

                    <label for="email">Your Email: </label>
                    <input type="email" name="" id="email">
                </fieldset>

                <fieldset>
                    <legend>Pitha Info</legend>
                    <input type="radio" name="pitha" id="chitoy">
                    <label for="chitoy">Chitoy Pitha</label>

                    <input type="radio" name="pitha" id="vapa">
                    <label for="vapa">Vapa Pitha</label>

                    <input type="radio" name="pitha" id="puri">
                    <label for="puri">Dal Puri</label>
                </fieldset>

                <fieldset>
                    <legend>Vorta Selection</legend>
                    <input type="checkbox" name="" id="shorisha">
                    <label for="shorisha">Shorisha Vorta</label>

                    <input type="checkbox" name="" id="shutki">
                    <label for="shutki">Shutki Vorta</label>

                    <input type="checkbox" name="" id="morich">
                    <label for="morich">Morich Vorta</label>
                </fieldset>

                <fieldset>
                    <legend>Extra Info</legend>
                    <textarea cols="50" rows="5" name="" id=""></textarea>
                </fieldset>

                <input type="submit" value="submit">
                <input type="reset" value="reset">
            </form>
        </section>
    </main>
    <footer></footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Flex</title>
    <style>
        .container{
            background-color: blue;
            height: 450px;
            width: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            background-color: red;
            height: 150px;
            width: 150px;
            font-size: 3em;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box</div>
    </div>
</body>
</html>
